{% extends "base.html" %}
{% load wagtailcore_tags %}

{% block content %}
<section class="hero-section" style="padding-top: 10rem; padding-bottom: 4rem;">
  <div class="container" style="text-align: center; max-width: 800px;">
    <div class="section-tag">Capabilities</div>
    <h1><span class="text-gradient">{{ page.title }}</span></h1>
    <div class="text-muted" style="font-size: 1.15rem; margin-top: 1rem;">
      {{ page.intro|richtext }}
    </div>
  </div>
</section>

<section>
  <div class="container">
    <div class="services-grid">
      {% for s in services %}
        <div class="service-card">
          <div>
            <div class="service-badge">{{ s.category }}</div>
            <h3>{{ s.title }}</h3>
            <p>{{ s.summary }}</p>
            <div style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.5rem; background: var(--bg-secondary); padding: 0.8rem; border-radius: var(--radius-sm); border: 1px solid var(--border-subtle);">
              <strong style="color: var(--accent-red-bright);">Tech Stack:</strong> {{ s.tech_stack }}
            </div>
          </div>
          <div>
            <a href="{{ s.url }}" class="btn btn-primary" style="width: 100%;">View Full Service Details →</a>
          </div>
        </div>
      {% endfor %}
    </div>
  </div>
</section>
{% endblock %}
