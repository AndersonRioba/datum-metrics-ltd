<section style="background: radial-gradient(circle at 50% 50%, rgba(229, 9, 20, 0.25) 0%, rgba(10, 11, 13, 1) 100%); border-top: 1px solid var(--border-accent);">
  <div class="container" style="text-align: center; max-width: 800px;">
    <div class="section-tag">Take Action</div>
    <h2 style="font-size: clamp(2rem, 4vw, 3rem); margin-bottom: 1.25rem;">{{ value.title }}</h2>
    <p style="color: var(--text-secondary); font-size: 1.15rem; margin-bottom: 2.5rem;">{{ value.text }}</p>
    <a href="{{ value.button_url }}" class="btn btn-primary" style="font-size: 1.1rem; padding: 1rem 2.2rem;">{{ value.button_text }} →</a>
  </div>
</section>
