<section class="testimonial-section">
  <div class="container">
    <div class="testimonial-wrapper">
      <div class="testimonial-card modern-testimonial-card">
        <div class="test-quote-icon">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="rgba(229,9,20,0.3)" xmlns="http://www.w3.org/2000/svg">
            <path d="M14.017 21v-7.391c0-5.704 3.731-9.57 8.983-10.609l.995 2.151c-2.432.917-3.995 3.638-3.995 5.849h4v10h-9.983zm-14.017 0v-7.391c0-5.704 3.748-9.57 9-10.609l.996 2.151c-2.433.917-3.996 3.638-3.996 5.849h3.983v10h-9.983z"/>
          </svg>
        </div>

        <div class="test-top-badge">
          <span class="live-dot green-dot"></span>
          <span>{% if value.metric_badge %}{{ value.metric_badge }}{% else %}Verified Client Partnership{% endif %}</span>
        </div>

        <blockquote class="testimonial-quote">
          "{{ value.quote }}"
        </blockquote>

        <div class="author-block">
          <div class="author-avatar">
            <span>{{ value.author|slice:":1" }}</span>
          </div>
          <div class="author-info">
            <h4 class="author-name">{{ value.author }}</h4>
            <p class="author-role">{{ value.role }} &bull; <span class="author-company text-red">{{ value.company }}</span></p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
