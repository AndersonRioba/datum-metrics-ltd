<section id="case-studies" class="case-studies-section">
  <div class="container">
    <div class="section-header text-center">
      <div class="section-tag">
        <span class="live-dot"></span>
        Client Case Studies
      </div>
      <h2 class="section-title">Proven Enterprise <span class="text-gradient">Impact &amp; Results</span></h2>
      {% if value.subtitle %}<p class="section-subtitle">{{ value.subtitle }}</p>{% endif %}
    </div>

    <div class="case-studies-grid">
      {% for cs in value.case_studies %}
        <div class="case-card modern-case-card">
          <div class="case-top-meta">
            <span class="client-badge">{{ cs.client_name }}</span>
            <span class="cat-badge-pill">{{ cs.category_tag }}</span>
          </div>

          <h3 class="case-card-title">{{ cs.project_title }}</h3>
          
          <div class="impact-pill modern-impact-pill">
            <span class="impact-icon">🚀</span>
            <span class="impact-text">{{ cs.impact_metric }}</span>
          </div>

          <p class="case-summary-text">{{ cs.summary }}</p>

          <div class="case-footer">
            <a href="{{ cs.link_url }}" class="case-study-btn">
              <span>View Full Case Study</span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </a>
          </div>
        </div>
      {% endfor %}
    </div>
  </div>
</section>
